name: E2E

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create kind cluster
        run: kind create cluster

      - name: Build controller image
        run: make build-image VERSION=e2e

      - name: Load image into kind
        run: kind load docker-image multi-network-controller:e2e

      - name: Deploy controller and CRD
        run: |
          kubectl apply -f deployment/
          kubectl set image deployment/multi-network-controller multi-network-controller=multi-network-controller:e2e
          kubectl rollout status deployment/multi-network-controller --timeout=60s

      - name: Run E2E tests
        run: make test-e2e
